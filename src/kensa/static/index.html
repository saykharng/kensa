<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kensa</title>
  <script>
    (function () {
      var theme = "dark";
      try {
        var stored = localStorage.getItem("kensa.theme");
        if (stored === "bright" || stored === "dark") theme = stored;
      } catch (error) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span>Kensa</div>
    <div id="repo-name" class="repo-name"></div>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="icon-button" aria-pressed="true" aria-label="Bright" title="Bright">
        <svg class="theme-icon theme-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
        </svg>
        <svg class="theme-icon theme-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button type="button" id="back" class="quiet" disabled>Back</button>
      <button type="button" id="edit" class="quiet">Edit</button>
      <button type="button" id="save" class="primary" hidden>Save</button>
      <button type="button" id="cancel-edit" class="quiet" hidden>Cancel</button>
      <button type="button" id="hold" class="quiet">Hold</button>
      <button type="button" id="send" class="primary">Send</button>
    </div>
  </header>
  <div id="pr-bar" class="pr-bar" hidden>
    <div id="pr-title"></div>
    <label id="commit-label" class="inline-label" hidden>Commit
      <select id="commit-select" aria-label="Commit"></select>
    </label>
    <div id="submit-controls" hidden>
      <label>Verdict
        <select id="verdict">
          <option value="COMMENT">Comment</option>
          <option value="REQUEST_CHANGES">Request changes</option>
          <option value="APPROVE">Approve</option>
        </select>
      </label>
      <input id="summary" type="text" placeholder="Summary for the author">
      <button type="button" id="submit-pr" class="primary">Submit review</button>
    </div>
  </div>
  <p id="notice" class="notice" hidden></p>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-toolbar">
        <h2 id="list-heading">Changes</h2>
        <button type="button" id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar-body" aria-label="Hide files" title="Hide files">
          <svg class="sidebar-arrow" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M11 2.5 6.5 8 11 13.5"/>
            <path d="M6.5 2.5 2 8l4.5 5.5"/>
          </svg>
        </button>
      </div>
      <div id="sidebar-body">
        <input id="file-search" type="search" placeholder="Quick open" aria-label="Quick open" autocomplete="off">
        <ul id="search-results" class="search-results"></ul>
        <ul id="file-list" class="file-list"></ul>
      </div>
    </aside>
    <main id="main">
      <div id="file-bar" class="file-bar" hidden>
        <div class="file-id">
          <span id="file-path"></span>
          <span id="file-flag" class="flag" hidden>Context</span>
          <button type="button" id="file-fold" class="quiet" hidden aria-expanded="false">Full file</button>
        </div>
        <label class="inline-label">Outline
          <select id="outline"></select>
        </label>
        <form id="jump-form">
          <input id="jump-symbol" type="text" placeholder="Jump to symbol" aria-label="Jump to symbol" autocomplete="off">
          <button type="submit" class="quiet">Jump</button>
        </form>
      </div>
      <div id="editor-wrap" hidden>
        <textarea id="editor" spellcheck="false" aria-label="File editor"></textarea>
      </div>
      <div id="code" class="code"></div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
